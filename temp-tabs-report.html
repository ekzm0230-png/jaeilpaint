<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임시 검증 · 보고서 탭 390px</title>
<style>
:root{--navy:#1B2A4A;--navy2:#14203A;--teal:#0D9488;--teal2:#0F766E;--ink:#111827;--body:#4B5563;--line:#E5E7EB;--soft:#F7F8FA;--warm:#FAF7F2;--wrap:760px}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:18px}
body{margin:0;background:#fff;color:var(--body);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","맑은 고딕",sans-serif;font-size:1.0625rem;line-height:1.66;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;padding-bottom:24px}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
h1,h2,h3{color:var(--ink);letter-spacing:-0.03em;word-break:keep-all;margin:0}
p{margin:0;word-break:keep-all}
ul,ol{margin:0;padding:0;list-style:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 18px}
.top{background:linear-gradient(160deg,#1B2A4A 0%,#24395F 60%,#1B4A55 100%);color:#DBE3EF;padding:30px 0 26px}
.kicker{margin:0 0 8px;font-size:.875rem;font-weight:700;letter-spacing:.02em;color:#7FD6CA}
.top h1{margin:0 0 10px;color:#fff;font-size:clamp(1.5rem,7vw,2rem);font-weight:800;line-height:1.28}
.lead{margin:0;font-size:1remrem;line-height:1.7;color:#C7D3E3}
.lead b{color:#fff}
.stats{display:flex;gap:10px;margin:18px 0 0}
.stats li{flex:1;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.stats b{display:block;color:#fff;font-size:1.25rem;font-weight:800;line-height:1.25}
.stats span{font-size:.8125rem;color:#AFC0D6}
.tabs{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
/* 모바일 포함 모든 화면 폭에서 9개 탭이 한눈에 펼쳐지도록 줄바꿈 (가로 스크롤·드래그 없음) */
.tabs .wrap{display:flex;flex-wrap:wrap;gap:8px;overflow-x:visible;padding:10px 18px;max-width:1120px}
.tabs .wrap.drag{cursor:grabbing;user-select:none;-webkit-user-select:none}
@media(min-width:768px){.tabs .wrap{row-gap:8px;cursor:default}}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:1px solid #D8DEE6;border-radius:999px;font-size:.9375rem;font-weight:700;color:#374151;white-space:nowrap;background:#fff;max-width:100%}
.tab i{font-style:normal;font-size:.8125rem;font-weight:800;color:var(--teal2);background:#E6F5F2;border-radius:999px;padding:1px 6px}
.tab.on,.tab:active{background:var(--navy);border-color:var(--navy);color:#fff}
.tab.on i{background:rgba(255,255,255,.2);color:#fff}
.section{padding:34px 0 10px;scroll-margin-top:76px}
/* 모바일: 2~3줄 탭이 화면 위쪽을 계속 덮지 않도록 상단 고정 해제 + 컴팩트 */
@media(max-width:767px){
  .tabs{position:static}
  .tabs .wrap{gap:6px;padding:8px 14px}
  .tab{padding:6px 10px;font-size:.8125rem;gap:4px}
  .tab i{font-size:.75rem;padding:1px 5px}
  .section{scroll-margin-top:14px}
}
.sec-h{font-size:1.375rem;font-weight:800;margin:0 0 8px}
.sec-p{font-size:.9375rem;color:#6B7280;margin:0 0 18px}
.src-sec{background:#fff}
.src-head{margin:0 0 20px;padding:18px;border-radius:16px;background:var(--warm);border:1px solid #EFE7DA}
.src-kicker{margin:0 0 4px;font-size:.875rem;font-weight:800;color:var(--teal2);letter-spacing:.02em}
.src-head .sec-h{font-size:1.25rem}
.src-meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;font-size:.875rem;color:#6B7280}
.src-meta span{background:#fff;border:1px solid #E7DFD2;border-radius:999px;padding:3px 9px}
.src-meta a{color:var(--teal2);font-weight:700;border-bottom:1px solid #BFE3DD}
.quote{margin:0;padding:10px 0 10px 14px;border-left:3px solid var(--teal);font-size:.9375rem;color:#4B5563;line-height:1.65}
.tags{margin:8px 0 0;font-size:.875rem;color:#9CA3AF;word-break:break-all}
.principle{margin:12px 0 0;font-size:.9375rem;color:#1F2937;background:#fff;border:1px dashed #D9CDB8;border-radius:10px;padding:10px 12px}
.count-note{margin:10px 0 0;font-size:.875rem;color:#6B7280;line-height:1.6}
.cover{margin:14px 0 0;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #EFE7DA}
.cover img{width:100%}
.cover figcaption{padding:8px 10px;font-size:.875rem;color:#6B7280;background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:0 0 22px;box-shadow:0 1px 2px rgba(17,24,39,.04),0 6px 20px rgba(17,24,39,.05)}
.photo{position:relative;margin:0;background:#F3F4F6;cursor:zoom-in;overflow:hidden}
.photo img{width:100%;display:block}
.zoom{position:absolute;right:10px;bottom:10px;background:rgba(17,24,39,.72);color:#fff;font-size:.8125rem;font-weight:700;padding:5px 9px;border-radius:999px}
.photo figcaption{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:#374151;font-size:.8125rem;font-weight:700;padding:4px 9px;border-radius:999px}
.card-body{padding:16px}
.card-body h3{font-size:1.1875rem;font-weight:800;line-height:1.4}
.sub{margin:4px 0 14px;font-size:.9375rem;color:#6B7280}
.sw-row{display:grid;gap:8px;margin:0 0 14px}
.sw{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;text-align:left;cursor:pointer;min-height:52px;transition:border-color .12s,background .12s}
.sw:active{background:var(--soft)}
.sw.copied{border-color:var(--teal);background:#F0FBF9}
.sw-chip{width:42px;height:42px;border-radius:9px;flex:none;border:1px solid rgba(17,24,39,.12)}
.sw-txt{display:flex;flex-direction:column;min-width:0}
.sw-txt b{font-size:.9375rem;color:var(--ink);letter-spacing:.02em}
.sw-txt em{font-style:normal;font-size:.9375rem;font-weight:700;color:#374151}
.sw-txt i{font-style:normal;font-size:.8125rem;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ratio-label{margin:0;font-size:.8125rem;font-weight:800;color:#6B7280;letter-spacing:.02em}
.rbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0;border:1px solid rgba(17,24,39,.08)}
.rbar i{display:block;height:100%}
.ratio-txt{margin:0 0 14px;font-size:.875rem;color:#6B7280}
.note{border-radius:12px;padding:11px 12px;margin:0 0 10px}
.note .tag{display:inline-block;font-size:.8125rem;font-weight:800;margin:0 0 5px;padding:2px 7px;border-radius:6px}
.note p{font-size:.9375rem;line-height:1.68;color:#374151}
.note.verified{background:#F4F6F9;border:1px solid #E3E8EF}
.note.verified .tag{background:#E3E8EF;color:#334155}
.note.match{background:#F5F7FB;border:1px solid #DCE3EF}
.note.match .tag{background:#1B2A4A;color:#fff}
.ml li{position:relative;padding:0 0 6px 0;font-size:.9375rem;line-height:1.6;color:#374151}
.ml li:last-child{padding-bottom:0}
.ml b{color:#1B2A4A;font-weight:800;margin-right:5px}
.note.match b{color:#1B2A4A}
.note.tip{background:#F0FBF9;border:1px solid #CDEDE7}
.note.tip .tag{background:#0D9488;color:#fff}
.note b{color:var(--teal2);font-weight:700}
.note.verified b{color:#334155}
.src{display:inline-flex;align-items:center;gap:5px;font-size:.875rem;font-weight:700;color:var(--teal2);border-bottom:1px solid #BFE3DD;padding:2px 0}
.gcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 16px}
.gcard h3{font-size:1.125rem;font-weight:800;margin:0 0 12px}
.ol{counter-reset:o}
.ol li{counter-increment:o;position:relative;padding:0 0 12px 30px;font-size:.9375rem;line-height:1.68}
.ol li::before{content:counter(o);position:absolute;left:0;top:2px;width:21px;height:21px;border-radius:50%;background:var(--navy);color:#fff;font-size:.8125rem;font-weight:800;display:grid;place-items:center}
.ol b{color:var(--ink)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.9375rem;min-width:600px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:var(--soft);font-size:.875rem;color:#374151;font-weight:800;white-space:nowrap}
td:first-child{font-weight:700;color:#1F2937;white-space:nowrap}
.ck li{position:relative;padding:0 0 10px 16px;font-size:.9375rem;line-height:1.66}
.ck li::before{content:"·";position:absolute;left:4px;top:-1px;color:var(--teal);font-weight:900}
.ck b{color:var(--ink)}
.script p{background:var(--soft);border-radius:10px;padding:11px 12px;font-size:.9375rem;line-height:1.7;margin:0 0 8px;color:#374151}
.script b{color:var(--teal2)}
.gcard.warn{background:#FFFBEB;border-color:#FDE68A}
.note.wall{background:#FFF9EF;border:1px solid #F2E2C4}
.note.wall .tag{background:#B45309;color:#fff}
.note.wall b{color:#92400E}
.note.why{background:#F3F6F4;border:1px solid #DCE5E0}
.note.why .tag{background:#2F6E5E;color:#fff}
.note.why b{color:#1F5A4B}
.pcodes{margin:0 0 14px;padding:12px 13px;border:1px solid #DCE3EF;border-radius:12px;background:#F7F9FC}
.pc-h{margin:0 0 8px;font-size:.9375rem;font-weight:800;color:#1B2A4A;letter-spacing:.02em}
.pc-sub{display:block;margin-top:3px;font-size:.8125rem;font-weight:600;color:#8A94A6;letter-spacing:0}
.pc-list li{padding:9px 0;border-top:1px dashed #DCE3EF}
.pc-list li:first-child{border-top:0;padding-top:0}
.pc-head{display:flex;align-items:center;gap:7px;margin:0 0 5px}
.pc-dot{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(17,24,39,.16)}
.pc-name{font-size:.875rem;font-weight:800;color:#1F2937}
.pc-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;padding-left:12px;font-size:.875rem;line-height:1.75;color:#374151;word-break:break-word}
.pc-line em{font-style:normal;font-weight:800;color:#0F766E;font-size:.8125rem;background:#E6F5F2;border-radius:4px;padding:1px 5px;vertical-align:1px;white-space:nowrap}
.pc-page{display:inline-block;padding:1px 8px;border:1px solid #E9CB80;border-radius:6px;background:#FFF3CE;color:#7A3E06;font-weight:900;font-size:1.0625rem;line-height:1.35;font-variant-numeric:tabular-nums;letter-spacing:.03em;vertical-align:1px}
.pc-code{font-size:.8125rem;font-weight:600;color:#6B7280;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-nm{color:#111827;font-weight:700;white-space:nowrap}
.pc-de{font-size:.8125rem;font-weight:700;color:#6B7280;white-space:nowrap}
.pc-de.warn{color:#B45309}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:#EDEFF2}
.strip figure{position:relative;margin:0}
.strip img{width:100%;aspect-ratio:3/4;object-fit:cover}
.strip figcaption{position:absolute;left:0;right:0;bottom:0;padding:2px 3px;font-size:.6875rem;font-weight:700;color:#fff;text-align:center;background:rgba(17,24,39,.55)}
.swcard{display:flex;gap:9px;align-items:flex-start;margin:0 0 12px;padding:8px;border:1px solid #E7DFD2;border-radius:12px;background:#FBF9F5}
.swcard img{width:68px;flex:none;border-radius:8px}
.swcard figcaption{font-size:.8125rem;line-height:1.6;color:#6B7280}
.callout{margin:16px 0 0;padding:12px 14px;border-radius:12px;background:#FFF9EF;border:1px solid #F2E2C4;font-size:.9375rem;line-height:1.68;color:#5B4A2F}
.callout b{color:#8A4B0F;font-weight:800}
@media(max-width:420px){.callout{font-size:.875rem;padding:11px 12px}}
.foot{margin:30px 0 0;padding:22px 0 40px;border-top:1px solid var(--line);font-size:.875rem;color:#9CA3AF;line-height:1.7}
.foot b{color:#6B7280}
.lb{position:fixed;inset:0;z-index:100;background:rgba(10,15,25,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:82vh;border-radius:10px}
.lb-cap{color:#D1D5DB;font-size:.9375rem;margin:10px 0 0;text-align:center}
.lb-x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,14px);background:#111827;color:#fff;font-size:.9375rem;font-weight:700;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:120}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:640px){
  .sw-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card-body{padding:20px}
  .stats{max-width:460px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
