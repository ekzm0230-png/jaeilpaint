<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;padding:0;background:#e5e5e5}iframe{display:block;border:0}</style></head><body>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var page=q.get('p')||'index.html', w=parseInt(q.get('w')||'390',10), h=parseInt(q.get('h')||'780',10);
  var f=document.createElement('iframe');
  f.src='./'+page; f.width=w; f.height=h; f.id='f'; f.setAttribute('title',page);
  document.body.appendChild(f);
})();
</script></body></html>
