<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>counter probe 4</title>
<style>body{font:12px/1.5 monospace;padding:14px}pre{white-space:pre-wrap}</style>
</head><body>
<h1>counter probe 4</h1>
<pre id="out">running…</pre>
<script>
var lines = [];
function log(s){ lines.push(s); document.getElementById('out').textContent = lines.join('\n'); }

function probe(label, url, opts, ms){
  var t0 = Date.now();
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, ms || 8000);
  var o = Object.assign({cache:'no-store', credentials:'omit', signal: ctrl.signal}, opts || {});
  return fetch(url, o)
    .then(function(r){ return r.text().then(function(b){ log(label + ' → ' + r.status + ' (' + (Date.now()-t0) + 'ms) ' + b.replace(/\s+/g,' ').slice(0,70)); }); })
    .catch(function(e){ log(label + ' → FAIL ' + (e && e.name) + ' (' + (Date.now()-t0) + 'ms)'); })
    .then(function(){ clearTimeout(timer); });
}

var K = 'jp_probe_' + Date.now().toString(36);
var steps = [
  ['mileshilliard hit', 'https://countapi.mileshilliard.com/api/v1/hit/' + K],
  ['mileshilliard get', 'https://countapi.mileshilliard.com/api/v1/get/' + K],
  ['mileshilliard get missing', 'https://countapi.mileshilliard.com/api/v1/get/missing_' + K],
  ['counterapi.com hit', 'https://counterapi.com/api/jp-probe/view/footer?readOnly=false'],
  ['counterapi.com read', 'https://counterapi.com/api/jp-probe/view/footer?readOnly=true'],
  ['tallywire hit', 'https://tallywire.cronpulse.workers.dev/hit/jp-probe/footer'],
  ['tallywire get', 'https://tallywire.cronpulse.workers.dev/get/jp-probe/footer'],
  ['tick.rs get', 'https://tick.rs/c/' + K + '.json'],
  ['abacus health', 'https://abacus.jasoncameron.dev/healthcheck']
];

steps.reduce(function(p, s){ return p.then(function(){ return probe(s[0], s[1]); }); }, Promise.resolve())
  .then(function(){ log('DONE'); });
</script>
</body></html>
