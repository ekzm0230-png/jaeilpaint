<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>counter probe 2</title>
<style>body{font:13px/1.55 monospace;padding:16px}pre{white-space:pre-wrap}</style>
</head><body>
<h1>counter probe 2</h1>
<pre id="out">running…</pre>
<script>
var lines = [];
function log(s){ lines.push(s); document.getElementById('out').textContent = lines.join('\n'); }

function probe(label, url, ms){
  var t0 = Date.now();
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, ms || 12000);
  return fetch(url, {cache:'no-store', credentials:'omit', signal: ctrl.signal})
    .then(function(r){ return r.text().then(function(b){ log(label + ' → ' + r.status + ' (' + (Date.now()-t0) + 'ms) ' + b.slice(0,70)); }); })
    .catch(function(e){ log(label + ' → FAIL ' + (e && e.name) + ' (' + (Date.now()-t0) + 'ms)'); })
    .then(function(){ clearTimeout(timer); });
}

var steps = [
  ['healthcheck #1', 'https://abacus.jasoncameron.dev/healthcheck'],
  ['get total #1',   'https://abacus.jasoncameron.dev/get/jaeilpaint-gj/total'],
  ['get total #2',   'https://abacus.jasoncameron.dev/get/jaeilpaint-gj/total'],
  ['info total',     'https://abacus.jasoncameron.dev/info/jaeilpaint-gj/total'],
  ['get day',        'https://abacus.jasoncameron.dev/get/jaeilpaint-gj/day-2026-11-21'],
  ['hit day(test ns)', 'https://abacus.jasoncameron.dev/hit/jprobe-xyz/day-2026-11-21'],
  ['healthcheck #2', 'https://abacus.jasoncameron.dev/healthcheck'],
  ['jsonblob read',  'https://jsonblob.com/api/jsonBlob/8f0f0f00-0000-0000-0000-000000000000']
];

steps.reduce(function(p, s){ return p.then(function(){ return probe(s[0], s[1]); }); }, Promise.resolve())
  .then(function(){ log('DONE'); });
</script>
</body></html>
